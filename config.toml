# gameon-clipper settings. This is the ONLY settings file.
# Paths in 'single quotes' are literal, so Windows backslashes are safe.
# $HOME is replaced with your user folder automatically.

[general]
channel_name = "Game On"
timezone = "Australia/Melbourne"
autopost = false            # Zero-Ban Policy: never upload automatically

[paths]
data_dir = "data"
database = "data/clips.sqlite"
log_file = "data/logs/clipper.log"
clips_dir = "data/clips"
exports_dir = "data/exports"   # `export` puts upload packages here, one folder per day
sessions_dir = "data/sessions"

[recorder]
check_interval_seconds = 60          # how often to ask "is the channel live?"
segment_seconds = 10                 # length of each .ts segment
keep_hours = 1                       # segments older than this are deleted
quality = "720p60,720p,best"         # tried in this order
twitch_low_latency = true

[tools]
whisper_cli = 'C:\whisper\Release\whisper-cli.exe'
whisper_model_en = '$HOME\whisper-models\ggml-small.en.bin'
whisper_model_multi = '$HOME\whisper-models\ggml-small.bin'
# These are found on your PATH. Change only if you want a specific copy.
ffmpeg = "ffmpeg"
streamlink = "streamlink"
claude = "claude"

[encoding]
prefer_hardware = true
encoders = ["h264_nvenc", "h264_qsv", "h264_amf"]   # tried in order
fallback = "libx264"
below_normal_priority = true

[clip]
min_seconds = 30
max_seconds = 40
script_min_words = 80
script_max_words = 110
hook_max_words = 12
context_before = 75         # seconds of footage kept before a spike
context_after = 35          # seconds kept after it (the worker waits this long first)
workers = 2                 # clipper workers running at the same time (whisper is heavy)

[ai]
model = "sonnet"            # headless Claude editor (claude -p --model ...)
min_score = 4.5             # normal mode: clips scoring below this are skipped
launch_mode = false         # true = channel-launch mode: use launch_min_score instead (more clips get through)
launch_min_score = 4
timeout_seconds = 240       # per Claude call
retries = 1                 # extra attempts when the reply is not valid JSON / exit code != 0

[render]
max_renders = 1             # video renders running at the same time (1 keeps the PC usable)

# ---- 10-15 fresh Shorts a day: up to 10 news (3 scheduled runs x 4 stories, stopped at news_per_day) + up to 5 live ----
# Live clips depend on what the streams do, so on a quiet day the total is lower; bangers can exceed the live cap.
# You review and upload by hand, so this is a candidate pool, not an upload schedule.
# A starting point: check `python -m clipper status` after a few days and adjust.
[volume]
daily_target = 15
news_per_day = 10                  # scheduled news runs stop here (a run you start by hand with `news` ignores it)
live_max_per_day = 5               # once this many live clips were accepted today (Melbourne day), weaker ones are skipped
live_cap_override_score = 9        # ...but a banger or a score >= this always gets through

# ---- Platform routing: top clips -> YouTube (one per peak slot below), the rest -> other platforms ----
[routing]
youtube_top = 3                    # best-of-best clips/Shorts sent to YouTube (2-3), one per [[slots]] entry in order
other_platforms = ["tiktok", "instagram", "facebook"]
window_hours = 36                  # clips made in this window compete for the slots
news_bonus = 0.5                   # ranking nudge for news Shorts

# ---- Channel watermark (assets/watermark.jpg -> assets/watermark.png, built automatically) ----
[watermark]
enabled = true
opacity = 0.40
width = 170                        # pixels on the 1080x1920 frame
margin = 36
corner = "left"                    # "left" or "right"; bottom, above the y=1450 safe-zone line

# ---- Breaking News Engine: python -m clipper news (feeds come from the [[feeds]] list below) ----
[news]
hours = 12                         # only stories newer than this
gta_hours = 48                     # gta.bat / news --only-gta look back further: there are fewer GTA stories
creators_hours = 36                # creators.bat / news --creators
tech_hours = 36                    # tech.bat / news --topic tech
promo_hours = 48                   # promo.bat / news --topic promo
banger_hours = 72                  # banger12.bat / news --all-niches
video = true                       # video clips in every news Short (assets/gameplay, YouTube, Steam trailers, Commons)
youtube = true                     # verified YouTube channels through yt-dlp; false = leave YouTube alone
official_only = true               # video only from publisher / platform channels, Steam trailers and your own recordings
# publisher / platform YouTube channels; the game's own channel and its Steam developer / publisher count too
official_channels = [
    "Rockstar Games", "PlayStation", "Xbox", "Xbox Game Studios", "Nintendo", "Steam",
    "Valve", "Epic Games", "Epic Games Store", "Ubisoft", "Electronic Arts", "EA",
    "EA SPORTS", "Bethesda Softworks", "Activision", "Call of Duty", "Blizzard Entertainment", "SEGA",
    "Capcom", "CapcomUSA", "Monster Hunter", "Resident Evil", "Square Enix", "Bandai Namco Entertainment",
    "2K", "Warner Bros. Games", "CD PROJEKT RED", "FromSoftware", "KONAMI", "THQ Nordic",
    "Focus Entertainment", "Devolver Digital", "Annapurna Interactive", "Paradox Interactive", "Riot Games", "VALORANT",
    "League of Legends", "Fortnite", "Minecraft", "Team Cherry", "Digital Extremes", "Warframe",
    "NVIDIA", "NVIDIA GeForce", "AMD", "Intel", "Intel Gaming", "ASUS ROG",
    "Lenovo Legion",
]
videos_max = 15                    # most clips per Short (3-4 s each); only what the length needs, pictures (2-2.5 s) fill gaps
picture_repeat_hours = 48          # avoid pictures that Shorts made this recently already showed (0 = off)
video_repeat_hours = 48            # never show footage that Shorts made this recently already showed (0 = off)
stories = 4                        # news Shorts per run (repeat stories are skipped: same URL, same headline, same event)
images_min = 8                     # fewer unique real pictures than this -> topped up with topic-matched game screenshots
images_max = 10                    # 8-10 real pictures per Short, 2-2.5 s each (never generated cards or text slides)
images_floor = 5                   # still fewer than this after the screenshot search -> the story is skipped
image_timeout = 15                 # seconds per picture / article-page download (each is retried)
wikimedia_contact = ""             # website or e-mail sent to Wikimedia only, as its robot policy asks; "" = slower (10 requests a minute)
# Article pictures: og:image, twitter:image, <picture>/srcset/data-src and in-article <img> (at least 1000x560 and in focus, no logos/ads).
# Top-up pictures: "<game> screenshot" / "<game> gameplay" via ddgs (DuckDuckGo Images) + Wikimedia Commons, cached in
# data/image_cache/<game>/ and validated with PIL + OpenCV before use.
script_min_words = 80
script_max_words = 105             # ~35 seconds spoken
target_seconds = 35
voice = "en-US-AndrewNeural"       # edge-tts voice: neutral and natural (fallbacks: Brian, Guy, Aria - all neutral)
rate = "+0%"                       # natural pace; the renderer nudges it only if the voiceover misses 30-40 s
pitch = "+0Hz"
groq_model = "whisper-large-v3-turbo"   # word timestamps (GROQ_API_KEY in .env)
max_candidates = 40                # headlines shown to Claude, balanced across the six buckets (newest first within each)
bucket_max = 2                     # at most this many Shorts of one bucket per run: flagship / freebie / update / glitch / creator / tech
auto_run = false                   # no automatic news: run news.bat (python -m clipper news) by hand each night
run_times = []                     # unused: there is no clock scheduler any more

# ---- Trend discovery: python -m clipper trends (also at the end of every `news` run) ----
# Reads public metadata only (YouTube search via yt-dlp, GamerPower giveaways). Claude verifies the core fact and rewrites it
# from scratch in Game On's voice; no third-party video, audio or thumbnail is ever used. Needs: pip install yt-dlp.
[trends]
enabled = true
per_run = 1                        # trend Shorts made at the end of each news run
min_views = 20000                  # ignore videos below this many views
giveaways = true                   # also look at live free-game giveaways (GamerPower)
queries = ["gaming easter egg shorts", "video game secret shorts", "gaming news shorts", "free steam games shorts", "patch notes surprise gaming shorts", "gaming facts shorts", "gta 6 secrets shorts", "funny video game glitch shorts"]

# ---- `python -m clipper clean`: delete old clip folders + rows (exports are never touched) ----
[clean]
skipped_days = 2            # skipped clips older than this
rejected_days = 2           # rejected clips older than this
posted_days = 7             # posted clips older than this

[notify]
enabled = true              # Windows toast when a strong clip finishes rendering (falls back to a console beep + log)
min_score = 8               # toast when the AI score is at least this ...
banger = true               # ... or when the AI editor flagged the clip as a banger

# ---- Background music for news Shorts: assets/music/ (+ credits.json with the license text) ----
[music]
enabled = true
dir = "assets/music"
track_lufs = -25.0                 # music bed level (-24..-28 LUFS): audible, with the voiceover ducking it a few dB while it speaks
final_lufs = -14.0                 # the finished Short's loudness

# ---- Posting slots (Melbourne time, AEDT = UTC+11) ----
[[slots]]
name = "Slot 1 - US Peak"
time = "10:00"

[[slots]]
name = "Slot 2 - India Peak"
time = "00:00"

[[slots]]
name = "Slot 3 - Global Peak"
time = "02:00"

[detect]
# --- Chat spikes: a 5-second bucket is a spike only when ALL four tests pass ---
bucket_seconds = 5
baseline_buckets = 60            # rolling baseline = last 60 buckets (5 minutes)
warmup_buckets = 12              # never fire during the first 12 buckets of a session
std_multiplier = 2.2             # count >= mean + 2.2 x standard deviation
median_multiplier = 1.8          # count >= 1.8 x median
min_messages = 8                 # count >= this (override per stream)
min_unique_ratio = 0.45          # unique chatters / messages >= 0.45
max_per_user = 2                 # count at most this many messages per user per bucket
cooldown_seconds = 75            # after a moment, that stream stays quiet this long
ignore_prefix = "!"              # ignore bot commands like !discord
ignore_users = ["nightbot", "streamelements", "moobot", "fossabot", "wizebot", "streamlabs", "soundalerts", "sery_bot"]
# --- Audio loudness (measured every second from the recording) ---
audio_enabled = true
audio_baseline_seconds = 300     # rolling baseline for the loudness z-score
audio_warmup_seconds = 30        # need this much audio before z-scores count
audio_min_std_db = 1.5           # floor on the baseline spread, so quiet streams don't blow up z
audio_alone_z = 3.5              # no chat reader: z >= this ...
audio_alone_hold_seconds = 2     # ... held this many seconds = a moment
audio_boost_z = 1.5              # chat spike + audio z >= this scores higher

# --- 0-10 pre-score = sum of weighted parts (each part is 0..1) ---
[detect.score]
weight_chat = 3.5                # how far the spike is above normal (chat z / chat_z_full)
weight_unique = 2.0              # how many different people (unique / unique_full)
weight_words = 2.0               # laugh / shock / hype words (messages with them / words_full)
weight_audio = 2.5               # loud audio (only counts at z >= audio_boost_z)
chat_z_full = 8.0
unique_full = 30
words_full = 5
audio_z_full = 4.0
audio_alone_base = 3.0           # audio-only moments (no chat) score 3 .. 8
audio_alone_span = 5.0
audio_alone_z_span = 4.0

# --- Words that raise the pre-score (case-insensitive, whole words) ---
[detect.words]
laugh = ["lol", "lmao", "lmfao", "rofl", "haha", "hahaha", "kekw", "omegalul", "lul", "icant", "dead", "😂", "🤣", "💀"]
shock = ["omg", "wtf", "wow", "no way", "holy", "insane", "bruh", "what", "clip it", "clip that", "cooked", "😱", "😳", "🤯"]
hype = ["pog", "poggers", "pogchamp", "pogu", "let's go", "lets go", "gg", "hype", "w", "clutch", "goated", "sheesh", "waah", "gajab", "ghazab", "mast", "🔥", "🙌"]

# Any stream below can override min_messages (and any other flat [detect] number),
# e.g.  min_messages = 6   or a table  [streams.detect]  with extra keys.

# ---- Live streams to watch ----
[[streams]]
platform = "twitch"
handle = "lacy"
url = "https://www.twitch.tv/lacy"
