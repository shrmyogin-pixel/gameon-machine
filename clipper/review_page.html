<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gameon Review</title>
<style>
  :root {
    --bg: #14161a; --panel: #1e2126; --line: #31363e; --text: #e8eaed; --dim: #9aa0a8;
    --accent: #6c8cff; --ok: #35c46a; --bad: #ef5350; --warn: #ffb300; --fire: #ff7a1a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 "Segoe UI", system-ui, sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line);
           padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: end; }
  h1 { font-size: 18px; margin: 0 8px 0 0; align-self: center; }
  label { display: flex; flex-direction: column; font-size: 11px; color: var(--dim); gap: 2px; }
  select, input, textarea, button { font: inherit; color: var(--text); background: #0f1114;
           border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
  select { min-width: 120px; }
  #summary { margin-left: auto; color: var(--dim); align-self: center; }
  main { padding: 16px; display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px;
          display: flex; flex-direction: column; gap: 8px; }
  .card.sensitive { border-color: var(--bad); }
  .media { position: relative; aspect-ratio: 9 / 16; max-height: 520px; width: 100%; background: #000;
           border-radius: 8px; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  .media video, .media img { width: 100%; height: 100%; object-fit: contain; }
  .nomedia { color: var(--dim); padding: 12px; text-align: center; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .badge { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: #2a2f37; }
  .badge.status-rendered { background: #26334f; color: #9db6ff; }
  .badge.status-approved { background: #1b3d2a; color: var(--ok); }
  .badge.status-rejected, .badge.status-failed { background: #4a2223; color: #ff8a80; }
  .badge.status-posted { background: #3a2f55; color: #c8a8ff; }
  .badge.status-skipped, .badge.status-new, .badge.status-edited { background: #2f3238; color: var(--dim); }
  .badge.banger { background: #4a2a10; color: var(--fire); }
  .badge.sens { background: #5a1e20; color: #ff8a80; }
  .badge.clean { background: #1b3d2a; color: var(--ok); }
  .badge.route-youtube { background: #4a1f1f; color: #ff9a8f; }
  .badge.route-other { background: #1f3a4a; color: #8fd0ff; }
  .badge.news { background: #2a2f55; color: #b4bcff; }
  .score { font-size: 22px; font-weight: 700; }
  .score small { font-size: 11px; font-weight: 400; color: var(--dim); }
  .who { color: var(--dim); font-size: 12px; }
  .warn { background: #3d1f20; border: 1px solid #6b2b2d; color: #ffb4ab; border-radius: 6px; padding: 6px 8px;
          font-size: 12px; }
  .note { color: var(--dim); font-size: 12px; }
  .card input[type=text], .card textarea { width: 100%; }
  .card textarea { min-height: 96px; resize: vertical; }
  .credit { font-size: 12px; color: var(--dim); border-left: 3px solid var(--line); padding-left: 8px;
            word-break: break-word; }
  .buttons { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }
  button { cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.approve { background: #1b3d2a; border-color: #2a6b43; }
  button.reject { background: #4a2223; border-color: #7a3537; }
  button.posted { background: #3a2f55; border-color: #5b4a8a; }
  button.save.dirty { border-color: var(--warn); color: var(--warn); }
  #empty { grid-column: 1 / -1; text-align: center; color: var(--dim); padding: 60px 0; }
  #toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: #2a2f37;
           border: 1px solid var(--line); padding: 8px 14px; border-radius: 8px; opacity: 0; transition: opacity .2s;
           pointer-events: none; }
  #toast.show { opacity: 1; }
  #toast.err { border-color: var(--bad); color: #ffb4ab; }
</style>
</head>
<body>
<header>
  <h1>Gameon Review</h1>
  <label>Status
    <select id="f-status">
      <option value="rendered">rendered (to review)</option>
      <option value="approved">approved</option>
      <option value="rejected">rejected</option>
      <option value="posted">posted</option>
      <option value="skipped">skipped</option>
      <option value="failed">failed</option>
      <option value="new">new</option>
      <option value="all">all</option>
    </select>
  </label>
  <label>Streamer <select id="f-streamer"><option value="">all</option></select></label>
  <label>Banger
    <select id="f-banger"><option value="">any</option><option value="yes">yes</option><option value="no">no</option></select>
  </label>
  <label>Sensitive
    <select id="f-sensitive"><option value="">any</option><option value="yes">yes</option><option value="no">no</option></select>
  </label>
  <label>Sort
    <select id="f-sort">
      <option value="newest">newest first</option>
      <option value="score">AI score (high to low)</option>
      <option value="prescore">pre-score (high to low)</option>
    </select>
  </label>
  <span id="summary"></span>
</header>
<main id="grid"></main>
<div id="toast"></div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const FILTERS = ["status", "streamer", "banger", "sensitive", "sort"];
let counts = {};

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (v !== false && v !== null && v !== undefined) el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid !== null && kid !== undefined && kid !== false)
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  return el;
}

let toastTimer;
function toast(msg, err) {
  const t = $("toast");
  t.textContent = msg;
  t.className = "show" + (err ? " err" : "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (t.className = ""), err ? 4500 : 1800);
}

async function api(path, body) {
  const res = await fetch(path, body === undefined ? {} : {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  let data = {};
  try { data = await res.json(); } catch (e) { /* not json */ }
  if (!res.ok) throw new Error(data.error || ("HTTP " + res.status));
  return data;
}

// ---- filters live in the URL hash so a refresh keeps them
function readHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  for (const f of FILTERS) if (p.has(f)) $("f-" + f).value = p.get(f);
}
function writeHash() {
  const p = new URLSearchParams();
  for (const f of FILTERS) if ($("f-" + f).value) p.set(f, $("f-" + f).value);
  history.replaceState(null, "", "#" + p);
}
function query() {
  const p = new URLSearchParams();
  for (const f of FILTERS) if ($("f-" + f).value) p.set(f, $("f-" + f).value);
  return p.toString();
}

function fmtTime(s) {
  if (!s) return "";
  const d = new Date(s.replace(" ", "T") + (s.includes("T") || s.endsWith("Z") ? "" : "Z"));
  return isNaN(d) ? s : d.toLocaleString();
}
const num = (v) => (v === null || v === undefined ? "–" : Number(v).toFixed(1));

function updateSummary() {
  $("summary").textContent = ["rendered", "approved", "rejected", "posted", "skipped", "failed"]
    .map((s) => `${s} ${counts[s] || 0}`).join("  ·  ");
}

function card(clip) {
  const state = { dirty: false, busy: false };
  const status = h("span", { class: "badge status-" + clip.status }, clip.status);
  const title = h("input", { type: "text", maxlength: 100, value: clip.title || "", "aria-label": "Title" });
  const desc = h("textarea", { "aria-label": "Description" });
  desc.value = clip.description_body || "";
  const tags = h("input", { type: "text", value: (clip.tags || []).join(", "), "aria-label": "Tags (comma separated)" });
  const saveBtn = h("button", { class: "save", onclick: () => save() }, "Save edits");
  saveBtn.disabled = true;
  const mark = () => { state.dirty = true; saveBtn.disabled = false; saveBtn.classList.add("dirty"); saveBtn.textContent = "Save edits"; };
  [title, desc, tags].forEach((el) => el.addEventListener("input", mark));

  const body = () => ({ title: title.value, description: desc.value,
    tags: tags.value.split(",").map((t) => t.trim()).filter(Boolean) });

  const root = h("article", { class: "card" + (clip.sensitive ? " sensitive" : ""), "data-id": clip.id });
  const buttons = [];
  const act = (label, cls, action, confirmMsg) => {
    const b = h("button", { class: cls, onclick: () => doAction(action, confirmMsg) }, label);
    buttons.push(b);
    return b;
  };

  function replaceWith(newClip, newCounts) {
    counts = newCounts; updateSummary();
    const cur = $("f-status").value;
    if (cur !== "all" && newClip.status !== cur) { root.remove(); checkEmpty(); return; }
    root.replaceWith(card(newClip));
  }
  async function save() {
    if (state.busy) return false;
    state.busy = true; saveBtn.disabled = true;
    try {
      const r = await api(`/api/clips/${clip.id}/edit`, body());
      state.dirty = false;
      counts = r.counts; updateSummary();
      Object.assign(clip, r.clip);
      desc.value = r.clip.description_body; title.value = r.clip.title; tags.value = r.clip.tags.join(", ");
      saveBtn.classList.remove("dirty"); saveBtn.textContent = "Saved";
      toast("Saved (profanity masked, credit line kept)");
      return true;
    } catch (e) { toast(e.message, true); saveBtn.disabled = false; return false;
    } finally { state.busy = false; }
  }
  async function doAction(action, confirmMsg) {
    if (confirmMsg && !confirm(confirmMsg)) return;
    if (state.dirty && !(await save())) return;
    buttons.forEach((b) => (b.disabled = true));
    try {
      const r = await api(`/api/clips/${clip.id}/status`, { action });
      toast({ approve: "Approved", reject: "Rejected", posted: "Marked as posted", undo: "Moved back to review" }[action]);
      replaceWith(r.clip, r.counts);
    } catch (e) { toast(e.message, true); buttons.forEach((b) => (b.disabled = false)); }
  }

  const media = h("div", { class: "media" });
  if (clip.video_url) {
    media.append(h("video", { controls: true, preload: "none", playsinline: true,
      poster: clip.thumb_url || false, src: clip.video_url }));
  } else if (clip.thumb_url) {
    media.append(h("img", { src: clip.thumb_url, alt: "thumbnail" }));
  } else {
    media.append(h("div", { class: "nomedia" }, "No video (" + clip.status + ")"));
  }
  root.append(media);

  root.append(h("div", { class: "row" },
    h("span", { class: "score" }, num(clip.ai_score), h("small", {}, " AI")),
    h("span", { class: "score" }, h("small", {}, num(clip.pre_score) + " pre-score")),
    status,
    clip.banger ? h("span", { class: "badge banger" }, "🔥 banger") : null,
    clip.platform === "news" ? h("span", { class: "badge news" }, "news") : null,
    clip.route_platform ? h("span", { class: "badge " + (clip.route_platform === "youtube" ? "route-youtube" : "route-other"),
      title: clip.route_at || "" }, "→ " + clip.route_platform + (clip.route_slot ? " · " + clip.route_slot : "")) : null,
    clip.sensitive ? h("span", { class: "badge sens" }, "⚠ sensitive") : h("span", { class: "badge clean" }, "not sensitive")));
  root.append(h("div", { class: "who" },
    h("strong", {}, clip.handle), " · ", clip.platform, clip.lang ? " · " + clip.lang : "", " · ", clip.moment_kind || "",
    h("br"), (clip.platform === "news" ? "made " : "spike ") + fmtTime(clip.moment_at || clip.created_at),
    clip.source_url ? [h("br"), "source: ", h("a", { href: clip.source_url, target: "_blank", rel: "noopener noreferrer",
      style: "color:#8fb4ff" }, clip.source_url)] : null,
    clip.clip_start_s !== null && clip.clip_end_s !== null ? ` · cut ${num(clip.clip_start_s)}s–${num(clip.clip_end_s)}s` : ""));
  if (clip.sensitive) root.append(h("div", { class: "warn" }, "Review carefully: " + (clip.sensitive_reason || "flagged by the AI editor")));
  if (clip.skip_reason) root.append(h("div", { class: "note" }, "Skipped: " + clip.skip_reason));
  if (clip.error) root.append(h("div", { class: "warn" }, "Error: " + clip.error));
  if (clip.hook) root.append(h("div", { class: "note" }, "Hook: " + clip.hook +
    ((clip.meme_caption || []).length ? "  |  Meme: " + clip.meme_caption.join(" / ") : "")));

  root.append(h("label", {}, "Title", title), h("label", {}, "Description", desc),
    h("div", { class: "credit", title: "Locked: every export must keep its credit line" }, clip.credit),
    h("label", {}, "Tags (comma separated)", tags));

  const canReview = clip.can_review;
  const s = clip.status;
  root.append(h("div", { class: "buttons" }, saveBtn,
    canReview && (s === "rendered" || s === "rejected") ? act("✔ Approve", "approve", "approve",
      clip.sensitive ? "This clip was flagged sensitive:\n" + (clip.sensitive_reason || "") + "\n\nApprove anyway?" : null) : null,
    canReview && (s === "rendered" || s === "approved") ? act("✖ Reject", "reject", "reject") : null,
    canReview && (s === "rendered" || s === "approved") ? act("📤 Mark Posted", "posted", "posted",
      "Mark as posted? Only do this after you uploaded it yourself.") : null,
    canReview && s !== "rendered" ? act("↩ Undo", "", "undo") : null));
  return root;
}

function checkEmpty() {
  const grid = $("grid");
  const has = grid.querySelector(".card");
  const old = $("empty");
  if (!has && !old) grid.append(h("div", { id: "empty" }, "No clips match these filters."));
  if (has && old) old.remove();
}

async function load() {
  writeHash();
  try {
    const data = await api("/api/clips?" + query());
    counts = data.counts; updateSummary();
    const sel = $("f-streamer"), keep = sel.value;
    sel.replaceChildren(h("option", { value: "" }, "all"), ...data.streamers.map((n) => h("option", { value: n }, n)));
    sel.value = data.streamers.includes(keep) ? keep : "";
    $("grid").replaceChildren(...data.clips.map(card));
    checkEmpty();
  } catch (e) { toast(e.message, true); }
}

readHash();
FILTERS.forEach((f) => $("f-" + f).addEventListener("change", load));
window.addEventListener("beforeunload", (e) => {
  if (document.querySelector(".save.dirty")) { e.preventDefault(); e.returnValue = ""; }
});
// the streamer list must exist before the hash value can be applied
(async () => {
  const want = new URLSearchParams(location.hash.slice(1)).get("streamer");
  if (want) $("f-streamer").append(h("option", { value: want }, want));
  readHash();
  await load();
})();
</script>
</body>
</html>
